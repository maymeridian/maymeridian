<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 312" role="img" aria-label="Hephaestus" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace">
  <rect width="600" height="312" fill="#07040a"/>
  <svg width="600" height="240" viewBox="0 0 600 240"><defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0" stop-color="#1b0e16"/>
      <stop offset="1" stop-color="#07040a"/>
    </radialGradient>
    <linearGradient id="anvil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd2a8"/>
      <stop offset="1" stop-color="#f08a68"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="600" height="240" fill="url(#bg)"/>

  <!-- spreadsheet rows in the background -->
  <g stroke="#c9b48f" stroke-opacity="0.18">
    <line x1="60" y1="40" x2="540" y2="40"/><line x1="60" y1="70" x2="540" y2="70"/>
    <line x1="60" y1="170" x2="540" y2="170"/><line x1="60" y1="200" x2="540" y2="200"/>
    <line x1="160" y1="30" x2="160" y2="80"/><line x1="440" y1="30" x2="440" y2="80"/>
    <line x1="160" y1="160" x2="160" y2="210"/><line x1="440" y1="160" x2="440" y2="210"/>
  </g>

  <!-- a sheet of four certificates, with its cut marks -->
  <g transform="rotate(-8 450 120)">
    <rect x="392" y="80" width="116" height="80" rx="2" fill="#f7f3ea" fill-opacity="0.9"/>
    <g stroke="#9e9e9e" stroke-width="1">
      <line x1="450" y1="74" x2="450" y2="86"/><line x1="450" y1="154" x2="450" y2="166"/>
      <line x1="386" y1="120" x2="398" y2="120"/><line x1="502" y1="120" x2="514" y2="120"/>
      <line x1="444" y1="120" x2="456" y2="120"/><line x1="450" y1="114" x2="450" y2="126"/>
    </g>
    <g fill="#1b0e16" opacity="0.75">
      <rect x="400" y="88" width="14" height="8"/><rect x="458" y="88" width="14" height="8"/>
      <rect x="400" y="128" width="14" height="8"/><rect x="458" y="128" width="14" height="8"/>
      <rect x="404" y="102" width="38" height="3"/><rect x="462" y="102" width="38" height="3"/>
      <rect x="404" y="142" width="38" height="3"/><rect x="462" y="142" width="38" height="3"/>
      <rect x="410" y="109" width="26" height="2"/><rect x="468" y="109" width="26" height="2"/>
      <rect x="410" y="149" width="26" height="2"/><rect x="468" y="149" width="26" height="2"/>
    </g>
  </g>

  <!-- sparks -->
  <g stroke="#fef08a" stroke-linecap="round" stroke-width="2" opacity="0.85">
    <line x1="232" y1="64" x2="222" y2="50"/><line x1="250" y1="58" x2="250" y2="42"/>
    <line x1="268" y1="64" x2="280" y2="51"/><line x1="216" y1="78" x2="200" y2="72"/>
  </g>

  <!-- the anvil -->
  <g filter="url(#glow)">
    <path d="M150 92 L 300 92 C 312 92, 318 100, 318 108 L 318 116 L 282 116 C 270 116, 262 124, 262 136
             L 262 146 L 290 146 L 300 176 L 170 176 L 180 146 L 208 146 L 208 136 C 208 124, 200 116, 188 116
             L 168 116 C 150 114, 128 104, 112 92 Z" fill="url(#anvil)" stroke="#d2583c" stroke-width="2"/>
    <path d="M168 104 L 300 104" stroke="#fff3e6" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round"/>
  </g></svg>
  <path d="M0 240 H600" stroke="#33264f"/>
  <text x="300" y="287" font-size="34" font-weight="600" fill="#ece4e0" text-anchor="middle">Hephaestus</text>
  <rect x="0.5" y="0.5" width="599" height="311" fill="none" stroke="#33264f"/>
</svg>
