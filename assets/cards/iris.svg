<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 312" role="img" aria-label="Iris" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace">
  <rect width="600" height="312" fill="#07040a"/>
  <svg width="600" height="240" viewBox="0 0 600 240"><defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0" stop-color="#170d22"/>
      <stop offset="1" stop-color="#07040a"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4450"/>
      <stop offset="1" stop-color="#2a2630"/>
    </linearGradient>
    <linearGradient id="rainbow" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#8b6cf0"/>
      <stop offset="0.5" stop-color="#b9a4ff"/>
      <stop offset="1" stop-color="#f08a68"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f08a68"/>
    </marker>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="bottle">
      <rect x="-20" y="-32" width="40" height="76" rx="7" fill="#e3dde6"/>
      <rect x="-13" y="-46" width="26" height="16" rx="3" fill="#f4eff2"/>
      <rect x="-20" y="-8" width="40" height="22" fill="#8b6cf0" opacity="0.75"/>
      <ellipse cx="-34" cy="40" rx="8" ry="4" fill="#5b8def"/>
      <ellipse cx="32" cy="38" rx="8" ry="4" fill="#5b8def" transform="rotate(-20 32 38)"/>
      <ellipse cx="-14" cy="50" rx="8" ry="4" fill="#e3dde6" transform="rotate(15 -14 50)"/>
    </g>
  </defs>

  <rect width="600" height="240" fill="url(#bg)"/>

  <!-- the rainbow Iris is named for -->
  <path d="M70 232 A230 200 0 0 1 530 232" fill="none" stroke="url(#rainbow)" stroke-width="2" opacity="0.35"/>
  <path d="M90 232 A210 182 0 0 1 510 232" fill="none" stroke="url(#rainbow)" stroke-width="1" opacity="0.2"/>

  <!-- the photo as shot: grey sweep, off-centre, with its shadow -->
  <rect x="115" y="50" width="140" height="140" fill="url(#sweep)" stroke="#33264f" stroke-width="1.5"/>
  <ellipse cx="172" cy="170" rx="34" ry="6" fill="#000" opacity="0.35"/>
  <use href="#bottle" transform="translate(170 128) scale(0.8)"/>

  <!-- on to the picture -->
  <line x1="272" y1="120" x2="322" y2="120" stroke="#f08a68" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- the picture: pure black, centred and larger, the cut line around it -->
  <g filter="url(#glow)">
    <rect x="340" y="50" width="140" height="140" fill="#000" stroke="#8b6cf0" stroke-width="1.5"/>
  </g>
  <use href="#bottle" transform="translate(410 120)"/>
  <path d="M388 82 H398 V70 H422 V82 H432 V158 H388 Z" fill="none" stroke="#f08a68" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.9"/></svg>
  <path d="M0 240 H600" stroke="#33264f"/>
  <text x="300" y="287" font-size="34" font-weight="600" fill="#ece4e0" text-anchor="middle">Iris</text>
  <rect x="0.5" y="0.5" width="599" height="311" fill="none" stroke="#33264f"/>
</svg>
