<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 486" role="img" aria-label="Jedi Challenges on PC VR: A 2017 phone AR lightsaber game whose headset is no longer sold, rebuilt for PC VR from the application itself: 1,086 classes translated back from machine code." font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace">
  <rect width="600" height="486" fill="#07040a"/>
  <svg width="600" height="240" viewBox="0 0 600 240"><defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#101426"/>
      <stop offset="1" stop-color="#07040a"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="240" fill="url(#bg)"/>

  <!-- the old way in: a phone, a beacon on the floor -->
  <rect x="62" y="96" width="42" height="74" rx="6" fill="#120b16" stroke="#6d5f66" stroke-width="1.5"/>
  <line x1="74" y1="160" x2="92" y2="160" stroke="#6d5f66" stroke-width="1.5"/>
  <circle cx="150" cy="186" r="9" fill="#120b16" stroke="#b9a4ff" stroke-width="1.5"/>
  <circle cx="150" cy="186" r="3" fill="#b9a4ff"/>

  <!-- to a headset -->
  <path d="M190 134 H250" stroke="#6d5f66" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
  <path d="M244 128 L252 134 L244 140" stroke="#6d5f66" stroke-width="1.5" fill="none"/>
  <rect x="286" y="108" width="128" height="52" rx="18" fill="#120b16" stroke="#33264f" stroke-width="2"/>
  <circle cx="322" cy="134" r="12" fill="none" stroke="#6d5f66" stroke-width="2"/>
  <circle cx="378" cy="134" r="12" fill="none" stroke="#6d5f66" stroke-width="2"/>

  <!-- the blade -->
  <g filter="url(#glow)">
    <line x1="446" y1="176" x2="548" y2="42" stroke="#4d8dff" stroke-width="12" stroke-linecap="round" opacity="0.5"/>
    <line x1="446" y1="176" x2="548" y2="42" stroke="#e6f1ff" stroke-width="5" stroke-linecap="round"/>
  </g>
  <line x1="428" y1="200" x2="444" y2="179" stroke="#c9b48f" stroke-width="10" stroke-linecap="round"/></svg>
  <path d="M0 240 H600" stroke="#33264f"/>
  <text x="28" y="284" font-size="25" font-weight="600" fill="#ece4e0">Jedi Challenges on PC VR</text>
  <text x="28" y="322" font-size="18" fill="#9a8f96">A 2017 phone AR lightsaber game whose headset is</text>
  <text x="28" y="348" font-size="18" fill="#9a8f96">no longer sold, rebuilt for PC VR from the</text>
  <text x="28" y="374" font-size="18" fill="#9a8f96">application itself: 1,086 classes translated back</text>
  <text x="28" y="400" font-size="18" fill="#9a8f96">from machine code.</text>
  <rect x="28" y="443" width="60" height="24" fill="none" stroke="#c9b48f" stroke-opacity="0.6"/><text x="37" y="460" font-size="14" fill="#c9b48f" textLength="42" lengthAdjust="spacingAndGlyphs">unity</text>
  <rect x="96" y="443" width="35" height="24" fill="none" stroke="#c9b48f" stroke-opacity="0.6"/><text x="105" y="460" font-size="14" fill="#c9b48f" textLength="17" lengthAdjust="spacingAndGlyphs">c#</text>
  <rect x="139" y="443" width="178" height="24" fill="none" stroke="#c9b48f" stroke-opacity="0.6"/><text x="148" y="460" font-size="14" fill="#c9b48f" textLength="160" lengthAdjust="spacingAndGlyphs">reverse engineering</text>
  <rect x="325" y="443" width="35" height="24" fill="none" stroke="#c9b48f" stroke-opacity="0.6"/><text x="334" y="460" font-size="14" fill="#c9b48f" textLength="17" lengthAdjust="spacingAndGlyphs">vr</text>
  <rect x="368" y="443" width="77" height="24" fill="none" stroke="#b9a4ff" stroke-opacity="0.6"/><text x="377" y="460" font-size="14" fill="#b9a4ff" textLength="59" lengthAdjust="spacingAndGlyphs">private</text>
  <rect x="0.5" y="0.5" width="599" height="485" fill="none" stroke="#33264f"/>
</svg>
