<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 486" role="img" aria-label="Tidal Disruption Event Classifier: First place in the MALLORN Kaggle challenge, with Maia. An ensemble classifier that identifies tidal disruption events, stars torn apart by black holes, in LSST light curves." font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace">
  <rect width="600" height="486" fill="#07040a"/>
  <svg width="600" height="240" viewBox="0 0 600 240"><defs>
    <radialGradient id="bg" cx="70%" cy="50%" r="80%">
      <stop offset="0" stop-color="#1c0f1e"/>
      <stop offset="1" stop-color="#07040a"/>
    </radialGradient>
    <linearGradient id="disk" x1="0" x2="1">
      <stop offset="0" stop-color="#8b6cf0" stop-opacity="0.2"/>
      <stop offset="0.3" stop-color="#d2583c"/>
      <stop offset="0.5" stop-color="#fff0d8"/>
      <stop offset="0.7" stop-color="#d2583c"/>
      <stop offset="1" stop-color="#8b6cf0" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="stream" x1="0" x2="1">
      <stop offset="0" stop-color="#fff5e1"/>
      <stop offset="0.6" stop-color="#f08a68"/>
      <stop offset="1" stop-color="#d2583c" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="star">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="0.35" stop-color="#ffd2a8" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#f08a68" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="600" height="240" fill="url(#bg)"/>
  <g fill="#fff" opacity="0.6">
    <circle cx="40" cy="30" r="1"/><circle cx="120" cy="200" r="0.8"/><circle cx="210" cy="50" r="1.2"/>
    <circle cx="300" cy="215" r="0.7"/><circle cx="540" cy="30" r="1"/><circle cx="575" cy="190" r="0.8"/>
    <circle cx="80" cy="120" r="0.6"/><circle cx="470" cy="215" r="1.1"/><circle cx="260" cy="140" r="0.6"/>
  </g>

  <g transform="rotate(-12 400 125)">
    <!-- far side of the disk, lensed over the top -->
    <path d="M335 125 A65 50 0 0 1 465 125" fill="none" stroke="#f08a68" stroke-width="6" opacity="0.45" filter="url(#glow)"/>
    <!-- debris stream spiralling in -->
    <path d="M150 95 C 230 60, 330 55, 430 95 S 420 150, 380 140" fill="none" stroke="url(#stream)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M150 95 C 230 75, 320 72, 420 102" fill="none" stroke="#fff5e1" stroke-width="1.2" opacity="0.7"/>
    <!-- disk + hole -->
    <ellipse cx="400" cy="125" rx="120" ry="24" fill="none" stroke="url(#disk)" stroke-width="10" filter="url(#glow)"/>
    <circle cx="400" cy="125" r="40" fill="#000" stroke="#ffd7aa" stroke-width="1.5" filter="url(#glow)"/>
    <path d="M280 125 A120 24 0 0 0 520 125" fill="none" stroke="url(#disk)" stroke-width="10" filter="url(#glow)"/>
  </g>

  <!-- the star being torn apart -->
  <ellipse cx="150" cy="122" rx="30" ry="18" fill="url(#star)" transform="rotate(-20 150 122)"/></svg>
  <path d="M0 240 H600" stroke="#33264f"/>
  <text x="28" y="284" font-size="25" font-weight="600" fill="#ece4e0">Tidal Disruption Event Classifier</text>
  <text x="28" y="322" font-size="18" fill="#9a8f96">First place in the MALLORN Kaggle challenge, with</text>
  <text x="28" y="348" font-size="18" fill="#9a8f96">Maia. An ensemble classifier that identifies tidal</text>
  <text x="28" y="374" font-size="18" fill="#9a8f96">disruption events, stars torn apart by black</text>
  <text x="28" y="400" font-size="18" fill="#9a8f96">holes, in LSST light curves.</text>
  <rect x="28" y="443" width="68" height="24" fill="none" stroke="#c9b48f" stroke-opacity="0.6"/><text x="37" y="460" font-size="14" fill="#c9b48f" textLength="50" lengthAdjust="spacingAndGlyphs">python</text>
  <rect x="104" y="443" width="152" height="24" fill="none" stroke="#c9b48f" stroke-opacity="0.6"/><text x="113" y="460" font-size="14" fill="#c9b48f" textLength="134" lengthAdjust="spacingAndGlyphs">machine learning</text>
  <rect x="264" y="443" width="119" height="24" fill="none" stroke="#c9b48f" stroke-opacity="0.6"/><text x="273" y="460" font-size="14" fill="#c9b48f" textLength="101" lengthAdjust="spacingAndGlyphs">astrophysics</text>
  <rect x="0.5" y="0.5" width="599" height="485" fill="none" stroke="#33264f"/>
</svg>
