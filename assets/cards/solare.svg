<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 486" role="img" aria-label="Solare: A Discord card-collecting bot with over 300,000 anime, manga, game and western characters, wishes with a pity system, trading, auctions, weekly quests and animated holo frames." font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace">
  <rect width="600" height="486" fill="#07040a"/>
  <svg width="600" height="240" viewBox="0 0 600 240"><defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0" stop-color="#160d24"/>
      <stop offset="1" stop-color="#07040a"/>
    </radialGradient>
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f08a68"/>
      <stop offset="0.35" stop-color="#ffd9a8"/>
      <stop offset="0.65" stop-color="#b9a4ff"/>
      <stop offset="1" stop-color="#6aa8ff"/>
    </linearGradient>
    <radialGradient id="sun">
      <stop offset="0" stop-color="#fff6e0"/>
      <stop offset="0.4" stop-color="#ffc27a"/>
      <stop offset="1" stop-color="#d2583c" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="600" height="240" fill="url(#bg)"/>
  <g fill="#fff" opacity="0.55">
    <circle cx="70" cy="40" r="1"/><circle cx="150" cy="200" r="0.8"/><circle cx="520" cy="50" r="1.1"/>
    <circle cx="560" cy="180" r="0.8"/><circle cx="110" cy="120" r="0.6"/><circle cx="480" cy="210" r="1"/>
  </g>

  <!-- constellation of filled and empty diamonds (C6) -->
  <g stroke="#b9a4ff" stroke-opacity="0.4" fill="none">
    <polyline points="130,70 175,100 160,150 205,180"/>
    <polyline points="470,60 425,95 450,145 400,180"/>
  </g>
  <g font-family="monospace" font-size="16" text-anchor="middle" fill="#b9a4ff">
    <text x="130" y="76">◆</text><text x="175" y="106">◆</text><text x="160" y="156">◆</text>
    <text x="470" y="66">◆</text><text x="425" y="101">◇</text><text x="450" y="151">◇</text>
  </g>

  <!-- back card -->
  <rect x="262" y="34" width="110" height="160" rx="8" fill="#140b1c" stroke="#33264f" stroke-width="2" transform="rotate(12 317 114)"/>
  <!-- front card with holo frame -->
  <g transform="rotate(-6 295 120)" filter="url(#glow)">
    <rect x="240" y="38" width="110" height="160" rx="8" fill="#1a0f22" stroke="url(#holo)" stroke-width="4"/>
    <circle cx="295" cy="104" r="36" fill="url(#sun)"/>
    <circle cx="295" cy="104" r="14" fill="#fff6e0"/>
    <rect x="256" y="160" width="78" height="6" fill="#c9b48f" opacity="0.6"/>
    <rect x="268" y="174" width="54" height="5" fill="#c9b48f" opacity="0.35"/>
  </g></svg>
  <path d="M0 240 H600" stroke="#33264f"/>
  <text x="28" y="284" font-size="25" font-weight="600" fill="#ece4e0">Solare</text>
  <text x="28" y="322" font-size="18" fill="#9a8f96">A Discord card-collecting bot with over 300,000</text>
  <text x="28" y="348" font-size="18" fill="#9a8f96">anime, manga, game and western characters, wishes</text>
  <text x="28" y="374" font-size="18" fill="#9a8f96">with a pity system, trading, auctions, weekly</text>
  <text x="28" y="400" font-size="18" fill="#9a8f96">quests and animated holo frames.</text>
  <rect x="28" y="443" width="68" height="24" fill="none" stroke="#c9b48f" stroke-opacity="0.6"/><text x="37" y="460" font-size="14" fill="#c9b48f" textLength="50" lengthAdjust="spacingAndGlyphs">python</text>
  <rect x="104" y="443" width="102" height="24" fill="none" stroke="#c9b48f" stroke-opacity="0.6"/><text x="113" y="460" font-size="14" fill="#c9b48f" textLength="84" lengthAdjust="spacingAndGlyphs">discord.py</text>
  <rect x="214" y="443" width="68" height="24" fill="none" stroke="#c9b48f" stroke-opacity="0.6"/><text x="223" y="460" font-size="14" fill="#c9b48f" textLength="50" lengthAdjust="spacingAndGlyphs">pillow</text>
  <rect x="290" y="443" width="77" height="24" fill="none" stroke="#b9a4ff" stroke-opacity="0.6"/><text x="299" y="460" font-size="14" fill="#b9a4ff" textLength="59" lengthAdjust="spacingAndGlyphs">private</text>
  <rect x="0.5" y="0.5" width="599" height="485" fill="none" stroke="#33264f"/>
</svg>
