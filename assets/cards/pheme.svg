<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 312" role="img" aria-label="Pheme" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace">
  <rect width="600" height="312" fill="#07040a"/>
  <svg width="600" height="240" viewBox="0 0 600 240"><defs>
    <radialGradient id="bg" cx="45%" cy="45%" r="75%">
      <stop offset="0" stop-color="#0e1420"/>
      <stop offset="1" stop-color="#07040a"/>
    </radialGradient>
    <linearGradient id="horn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bfe9ff"/>
      <stop offset="1" stop-color="#4fb8f0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="600" height="240" fill="url(#bg)"/>

  <!-- the herald's horn -->
  <g filter="url(#glow)">
    <rect x="128" y="113" width="16" height="14" rx="3" fill="url(#horn)"/>
    <rect x="144" y="116" width="86" height="8" fill="url(#horn)"/>
    <g fill="url(#horn)"><rect x="168" y="100" width="7" height="16"/><rect x="182" y="100" width="7" height="16"/><rect x="196" y="100" width="7" height="16"/></g>
    <path d="M228 116 L290 84 V156 L228 124 Z" fill="url(#horn)"/>
  </g>

  <!-- what it spreads -->
  <g fill="none" stroke="#4fb8f0" stroke-width="2" stroke-linecap="round" opacity="0.75">
    <path d="M306 100 Q318 120 306 140"/>
    <path d="M320 90 Q338 120 320 150"/>
  </g>

  <!-- the listings, in the store's way -->
  <g stroke="#2c3a52" stroke-width="1.2">
    <g transform="translate(364 58)">
      <rect width="150" height="40" rx="4" fill="#101826"/>
      <rect x="6" y="6" width="28" height="28" fill="#e9eef5" stroke="none"/>
      <rect x="42" y="10" width="92" height="5" rx="2" fill="#bfe9ff" stroke="none"/>
      <rect x="42" y="22" width="56" height="4" rx="2" fill="#5d6f88" stroke="none"/>
    </g>
    <g transform="translate(380 102)">
      <rect width="150" height="40" rx="4" fill="#101826"/>
      <rect x="6" y="6" width="28" height="28" fill="#e9eef5" stroke="none"/>
      <rect x="42" y="10" width="84" height="5" rx="2" fill="#bfe9ff" stroke="none"/>
      <rect x="42" y="22" width="62" height="4" rx="2" fill="#5d6f88" stroke="none"/>
    </g>
    <g transform="translate(364 146)">
      <rect width="150" height="40" rx="4" fill="#101826"/>
      <rect x="6" y="6" width="28" height="28" fill="#e9eef5" stroke="none"/>
      <rect x="42" y="10" width="96" height="5" rx="2" fill="#bfe9ff" stroke="none"/>
      <rect x="42" y="22" width="50" height="4" rx="2" fill="#5d6f88" stroke="none"/>
    </g>
  </g>
  <!-- each one waits for a tick -->
  <g fill="none" stroke="#3aa58a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M498 76 l4 4 l8 -9"/>
    <path d="M514 120 l4 4 l8 -9"/>
  </g>
  <circle cx="504" cy="166" r="6" fill="none" stroke="#e8c26a" stroke-width="1.6"/></svg>
  <path d="M0 240 H600" stroke="#33264f"/>
  <text x="300" y="287" font-size="34" font-weight="600" fill="#ece4e0" text-anchor="middle">Pheme</text>
  <rect x="0.5" y="0.5" width="599" height="311" fill="none" stroke="#33264f"/>
</svg>
