    <g fill="#9a8f96" opacity="0.75" font-size="16">
      <g class="ticker">
      <text x="0" y="346"><tspan dy="0" font-size="16">iℏ ∂ψ/∂t = Ĥψ</tspan></text>
      <text x="195" y="346"><tspan dy="0" font-size="16">G</tspan><tspan dy="5" font-size="11">μν</tspan><tspan dy="-5" font-size="16"> + Λg</tspan><tspan dy="5" font-size="11">μν</tspan><tspan dy="-5" font-size="16"> = (8πG/c⁴) T</tspan><tspan dy="5" font-size="11">μν</tspan></text>
      <text x="487" y="346"><tspan dy="0" font-size="16">∇·E = ρ/ε₀</tspan></text>
      <text x="653" y="346"><tspan dy="0" font-size="16">r</tspan><tspan dy="5" font-size="11">t</tspan><tspan dy="-5" font-size="16"> ≈ R</tspan><tspan dy="5" font-size="11">★</tspan><tspan dy="-5" font-size="16">(M</tspan><tspan dy="5" font-size="11">BH</tspan><tspan dy="-5" font-size="16">/M</tspan><tspan dy="5" font-size="11">★</tspan><tspan dy="-5" font-size="16">)</tspan><tspan dy="-7" font-size="11">1/3</tspan></text>
      <text x="872" y="346"><tspan dy="0" font-size="16">L ∝ t</tspan><tspan dy="-7" font-size="11">−5/3</tspan></text>
      <text x="1016" y="346"><tspan dy="0" font-size="16">S = k</tspan><tspan dy="5" font-size="11">B</tspan><tspan dy="-5" font-size="16"> ln Ω</tspan></text>
      <text x="1189" y="346"><tspan dy="0" font-size="16">E² = (pc)² + (mc²)²</tspan></text>
      <text x="1441" y="346"><tspan dy="0" font-size="16">Δx Δp ≥ ℏ/2</tspan></text>
      <text x="1617" y="346"><tspan dy="0" font-size="16">r</tspan><tspan dy="5" font-size="11">s</tspan><tspan dy="-5" font-size="16"> = 2GM/c²</tspan></text>
      <text x="1790" y="346"><tspan dy="0" font-size="16">iℏ ∂ψ/∂t = Ĥψ</tspan></text>
      <text x="1985" y="346"><tspan dy="0" font-size="16">G</tspan><tspan dy="5" font-size="11">μν</tspan><tspan dy="-5" font-size="16"> + Λg</tspan><tspan dy="5" font-size="11">μν</tspan><tspan dy="-5" font-size="16"> = (8πG/c⁴) T</tspan><tspan dy="5" font-size="11">μν</tspan></text>
      <text x="2277" y="346"><tspan dy="0" font-size="16">∇·E = ρ/ε₀</tspan></text>
      <text x="2443" y="346"><tspan dy="0" font-size="16">r</tspan><tspan dy="5" font-size="11">t</tspan><tspan dy="-5" font-size="16"> ≈ R</tspan><tspan dy="5" font-size="11">★</tspan><tspan dy="-5" font-size="16">(M</tspan><tspan dy="5" font-size="11">BH</tspan><tspan dy="-5" font-size="16">/M</tspan><tspan dy="5" font-size="11">★</tspan><tspan dy="-5" font-size="16">)</tspan><tspan dy="-7" font-size="11">1/3</tspan></text>
      <text x="2662" y="346"><tspan dy="0" font-size="16">L ∝ t</tspan><tspan dy="-7" font-size="11">−5/3</tspan></text>
      <text x="2806" y="346"><tspan dy="0" font-size="16">S = k</tspan><tspan dy="5" font-size="11">B</tspan><tspan dy="-5" font-size="16"> ln Ω</tspan></text>
      <text x="2979" y="346"><tspan dy="0" font-size="16">E² = (pc)² + (mc²)²</tspan></text>
      <text x="3231" y="346"><tspan dy="0" font-size="16">Δx Δp ≥ ℏ/2</tspan></text>
      <text x="3407" y="346"><tspan dy="0" font-size="16">r</tspan><tspan dy="5" font-size="11">s</tspan><tspan dy="-5" font-size="16"> = 2GM/c²</tspan></text>
